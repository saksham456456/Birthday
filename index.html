<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Entry Gate | The Birthday Universe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="preloader">
        <div class="loader-star"></div>
    </div>

    <div class="cursor-light"></div>

    <main class="landing-portal">
        <section class="hero-fullscreen">
            <!-- Background Stars/Particles Container -->
            <div id="stars-container"></div>

            <div class="hero-content">
                <p class="hero-subline">This universe was built for one person.</p>
                <h1 class="title-large hero-name gold-text">ALEX</h1>
                <button id="enter-portal" class="btn-portal">
                    <span>ENTER PORTAL</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </section>
    </main>

    <!-- Navigation (Common) -->
    <div class="nav-orb" id="nav-orb-btn">
        <div class="orb-inner"></div>
    </div>
    <nav class="nav-menu" id="main-nav">
        <a href="index.html" class="nav-item">Home</a>
        <a href="timeline.html" class="nav-item">Timeline</a>
        <a href="memories.html" class="nav-item">Memories</a>
        <a href="challenges.html" class="nav-item">Challenges</a>
        <a href="letter.html" class="nav-item">Letter</a>
        <a href="wishes.html" class="nav-item">Wishes</a>
        <a href="finale.html" class="nav-item">Finale</a>
    </nav>

    <div class="page-transition"></div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Update UI from CONFIG
            document.querySelector('.hero-name').innerText = CONFIG.name;
            document.querySelector('.hero-subline').innerText = CONFIG.heroText;

            // Entrance Animations
            gsap.from(".hero-subline", { opacity: 0, y: 20, duration: 1.5, delay: 0.5 });
            gsap.from(".hero-name", { opacity: 0, scale: 0.9, duration: 2, delay: 1, ease: "power2.out" });
            gsap.from(".btn-portal", { opacity: 0, y: 30, duration: 1, delay: 2 });

            document.getElementById('enter-portal').addEventListener('click', () => {
                const tl = gsap.timeline({
                    onComplete: () => window.location.href = 'timeline.html'
                });
                tl.to(".hero-content", { opacity: 0, scale: 1.1, duration: 1, ease: "power2.in" });
                tl.to(".page-transition", { y: 0, duration: 0.8, ease: "power4.inOut" }, "-=0.2");
            });
        });
    </script>
    <style>
        .hero-fullscreen {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: -1;
        }
        .hero-subline {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .btn-portal {
            margin-top: 50px;
            padding: 15px 40px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: white;
            font-family: var(--font-body);
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.5s;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }
        .btn-portal:hover {
            border-color: var(--gold);
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</body>
</html>
