<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes From The Stars | The Birthday Universe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="preloader"><div class="loader-star"></div></div>
    <div class="cursor-light"></div>

    <main class="wishes-stars">
        <header class="page-header container">
            <h2 class="title-large gold-text">WISHES FROM THE STARS</h2>
            <p class="subtitle">Click a star to reveal a message.</p>
        </header>

        <div id="stars-field" class="stars-field">
            <!-- Wishes stars injected here -->
        </div>

        <div id="wish-modal" class="wish-modal">
            <div class="glass-panel wish-card-popup">
                <button class="close-wish">&times;</button>
                <h4 id="wish-from" class="gold-text"></h4>
                <p id="wish-text"></p>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <div class="nav-orb" id="nav-orb-btn"><div class="orb-inner"></div></div>
    <nav class="nav-menu" id="main-nav">
        <a href="index.html" class="nav-item">Home</a>
        <a href="timeline.html" class="nav-item">Timeline</a>
        <a href="memories.html" class="nav-item">Memories</a>
        <a href="challenges.html" class="nav-item">Challenges</a>
        <a href="letter.html" class="nav-item">Letter</a>
        <a href="wishes.html" class="nav-item">Wishes</a>
        <a href="finale.html" class="nav-item">Finale</a>
    </nav>

    <div class="page-transition"></div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const field = document.getElementById('stars-field');
            const modal = document.getElementById('wish-modal');
            const wishFrom = document.getElementById('wish-from');
            const wishText = document.getElementById('wish-text');
            const closeBtn = document.querySelector('.close-wish');

            CONFIG.wishes.forEach((wish, index) => {
                const star = document.createElement('div');
                star.className = 'wish-star';

                // Random position
                const x = Math.random() * 80 + 10;
                const y = Math.random() * 60 + 20;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;

                // Random float animation
                gsap.to(star, {
                    y: "-=20",
                    duration: 2 + Math.random() * 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut",
                    delay: Math.random() * 2
                });

                star.addEventListener('click', () => {
                    wishFrom.innerText = `From: ${wish.from}`;
                    wishText.innerText = wish.message;
                    modal.classList.add('active');
                    gsap.from(".wish-card-popup", { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(1.7)" });
                });

                field.appendChild(star);
            });

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });
        });
    </script>
    <style>
        .wishes-stars { height: 100vh; overflow: hidden; position: relative; }
        .page-header { text-align: center; padding-top: 100px; }
        .subtitle { letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted); margin-top: 10px; }

        .stars-field { width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }

        .wish-star {
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff 0%, var(--gold) 30%, transparent 70%);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            pointer-events: all;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            transition: 0.3s;
        }
        .wish-star:hover { transform: scale(1.5); box-shadow: 0 0 40px var(--gold); }

        .wish-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
        }
        .wish-modal.active { opacity: 1; pointer-events: all; }

        .wish-card-popup { max-width: 400px; width: 90%; text-align: center; position: relative; }
        .wish-card-popup h4 { margin-bottom: 20px; font-size: 1.5rem; }
        .wish-card-popup p { font-size: 1.1rem; line-height: 1.6; }

        .close-wish {
            position: absolute; top: -40px; right: 0;
            background: none; border: none; color: white; font-size: 2rem; cursor: pointer;
        }
    </style>
</body>
</html>
